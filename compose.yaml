services:
  switchboard:
    build: .
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required. Set it in .env or the environment.}
      DB_PATH: /app/data/switchboard.db
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - switchboard-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  switchboard-data:
