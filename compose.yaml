services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Set it in .env or the environment.}
      POSTGRES_DB: switchboard
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - switchboard-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U switchboard -d switchboard
      interval: 5s
      timeout: 3s
      retries: 10

  switchboard:
    build: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required. Set it in .env or the environment.}
      DATABASE_URL: postgres://switchboard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required.}@postgres:5432/switchboard
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  switchboard-pg-data:
